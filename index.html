<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto-Refreshing QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 24px; border: 2px solid #000000; border-radius: 12px; }
    #qrcode { margin: 20px auto; display: inline-block; }
    .timer { font-size: 1.1rem; font-weight: 600; color: #000000; }
  </style>
</head>
<body>
  <div class="card">
    <h2>QR Code Refresher</h2>
    <div id="qrcode"></div>
    <div class="timer">Refreshing in <span id="countdown">10</span>s</div>
  </div>

  <script>
    const REFRESH_SECONDS = 10;
    let timeLeft = REFRESH_SECONDS;
    const qrContainer = document.getElementById("qrcode");
    const countdownEl = document.getElementById("countdown");

    function generateToken() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).substring(2) + Date.now().toString(36);
    }

    function generateQR() {
      // For production, fetch this payload from your backend instead
      const payload = JSON.stringify({
        token: generateToken(),
        issuedAt: Date.now()
      });

      qrContainer.innerHTML = ""; // Clear the previous QR code
      new QRCode(qrContainer, {
        text: payload,
        width: 220,
        height: 220
      });
    }

    generateQR();

    setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        generateQR();
        timeLeft = REFRESH_SECONDS;
      }
      countdownEl.textContent = timeLeft;
    }, 1000);
  </script>
</body>
</html>
